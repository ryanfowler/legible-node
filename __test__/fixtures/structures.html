<!doctype html>
<html>
  <body>
    <main>
      <h1>Structured fixture</h1>
      <p>Introductory text gives this document enough context for extraction.</p>
      <ul>
        <li>First item</li>
        <li>Second item</li>
      </ul>
      <pre><code>const answer = 42;</code></pre>
      <table>
        <thead>
          <tr>
            <th>Name</th>
            <th>Value</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>Answer</td>
            <td>42</td>
          </tr>
        </tbody>
      </table>
      <figure>
        <img src="/figure.png" alt="A figure" />
        <figcaption>Figure caption</figcaption>
      </figure>
    </main>
  </body>
</html>
