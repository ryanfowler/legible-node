
[package]
edition = "2021"
name = "legible"
version = "0.1.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
legible_upstream = { package = "legible", git = "https://github.com/ryanfowler/legible", rev = "899356a2540863898b2c9fe639241da606889256" }
napi-derive = "3.0.0"

[dependencies.napi]
version = "3.0.0"
features = ["napi8"]

[build-dependencies]
napi-build = "2"

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"
